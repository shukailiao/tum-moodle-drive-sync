[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "tum-moodle-drive-sync"
version = "0.1.0"
description = "Session-based Moodle downloads into a Google Drive desktop folder"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
dependencies = ["beautifulsoup4>=4.12,<5", "httpx>=0.28,<0.29", "playwright>=1.49,<2", "platformdirs>=4,<5", "filelock>=3.16,<4"]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.9,<1", "build>=1.2,<2"]

[project.scripts]
tum-moodle-sync = "tum_moodle_drive_sync.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["browser: real Chromium with synthetic intercepted Moodle responses"]

[tool.ruff]
line-length = 100

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
